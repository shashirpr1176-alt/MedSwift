<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="MedSwift — Smart healthcare, prescription verification and pharmacy management platform.">
<title>MedSwift — Smart Healthcare &amp; Pharmacy Platform</title>
<style>
/* ============================================================
   MedSwift — Design tokens
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --navy:#0b2545; --navy-2:#15395e; --ink:#0b2545; --muted:#5b7290;
  --teal:#0d9488; --teal-d:#0f766e; --teal-l:#e6f6f4;
  --bg:#f5f9fc; --card:#ffffff; --line:#e3ecf5; --line-2:#eef4fa;
  --green:#15803d; --green-l:#e8f7ee; --amber:#b45309; --amber-l:#fdf3e3;
  --red:#b91c1c; --red-l:#fdecec; --purple:#6d28d9; --purple-l:#f1ebfe;
  --blue:#1d4ed8; --blue-l:#e8f1fb; --slate-l:#eef2f7;
  --r:14px; --r-sm:10px; --r-xs:8px;
  --shadow:0 1px 2px rgba(11,37,69,.06), 0 8px 24px rgba(11,37,69,.06);
  --shadow-lg:0 24px 60px rgba(11,37,69,.22);
  --sidebar-w:264px;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"Noto Sans Devanagari",sans-serif;
}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
body.dark{
  --bg:#0a1725; --card:#102338; --ink:#e8f1fb; --muted:#93aac4;
  --line:#1d3a56; --line-2:#17304a; --slate-l:#16304a; --blue-l:#152c47;
  --teal-l:#12333a; --green-l:#12321f; --amber-l:#3a2c12; --red-l:#3a1b1b; --purple-l:#2a1f45;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
a{color:var(--teal-d);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1.02rem}h4{font-size:.92rem}
p{margin:0 0 .8em}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   Layout shell
   ============================================================ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--card);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line-2)}
.brand-mark{width:38px;height:38px;flex:0 0 38px}
.brand-txt strong{display:block;font-size:1.06rem;letter-spacing:-.02em}
.brand-txt span{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{padding:10px 10px 24px;display:flex;flex-direction:column;gap:2px}
.nav-group-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 10px 5px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);
  color:var(--navy-2);font-size:.875rem;font-weight:500;cursor:pointer;border:none;
  background:transparent;width:100%;text-align:left;font-family:inherit;transition:background .16s,color .16s;
}
body.dark .nav-item{color:#c8dbf0}
.nav-item:hover{background:var(--slate-l)}
.nav-item.active{background:var(--teal-l);color:var(--teal-d);font-weight:700}
body.dark .nav-item.active{color:#5eead4}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;font-size:.66rem;padding:1px 7px;font-weight:700}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;
}
body.dark .topbar{background:rgba(16,35,56,.92)}
.hamburger{display:none;background:none;border:1px solid var(--line);border-radius:var(--r-xs);padding:7px;cursor:pointer;line-height:0}
.hamburger svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.top-title{font-weight:700;font-size:.98rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.view{padding:20px;max-width:1360px;width:100%;margin:0 auto}
.view-head{margin-bottom:16px}
.view-head h1{margin-bottom:2px}
.view-head .sub{color:var(--muted);font-size:.875rem;margin:0}
.backdrop{display:none;position:fixed;inset:0;background:rgba(11,37,69,.5);z-index:35}
.backdrop.show{display:block}

@media(max-width:960px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:inline-flex}
  .view{padding:14px}
  .topbar{padding:9px 13px}
}

/* ============================================================
   Components
   ============================================================ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card.tight{padding:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2,.card-head h3{margin:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  background:var(--card);color:var(--navy);border:1px solid var(--line);
  padding:8px 14px;border-radius:var(--r-xs);font-size:.845rem;font-weight:600;cursor:pointer;
  font-family:inherit;transition:.16s;white-space:nowrap;
}
.btn:hover{background:var(--slate-l);border-color:#cfdeee}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d);border-color:var(--teal-d)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:var(--navy-2)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{filter:brightness(.92)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--teal-d)}
.btn.ghost:hover{background:var(--teal-l)}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn.xs{padding:3px 8px;font-size:.72rem;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.badge.gray{background:var(--slate-l);color:var(--muted)}
.badge.green{background:var(--green-l);color:var(--green)}
.badge.amber{background:var(--amber-l);color:var(--amber)}
.badge.red{background:var(--red-l);color:var(--red)}
.badge.blue{background:var(--blue-l);color:var(--blue)}
.badge.teal{background:var(--teal-l);color:var(--teal-d)}
.badge.purple{background:var(--purple-l);color:var(--purple)}
.badge.outline{background:transparent;border:1px dashed var(--line);color:var(--muted)}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi .k-val{font-size:1.75rem;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px;line-height:1}
.kpi .k-sub{font-size:.75rem;color:var(--muted)}
.kpi .k-ico{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--teal-l)}
.kpi .k-ico svg{width:16px;height:16px;stroke:var(--teal-d);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

label{display:block;font-size:.78rem;font-weight:700;color:var(--navy-2);margin-bottom:4px}
body.dark label{color:#b9cfe6}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=tel],input[type=search],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-xs);
  font-family:inherit;font-size:.87rem;background:var(--card);color:var(--ink);transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l);outline:none}
textarea{min-height:82px;resize:vertical}
.field{margin-bottom:12px}
.field .hint{font-size:.72rem;color:var(--muted);margin-top:3px}
.err{color:var(--red);font-size:.74rem;margin-top:3px;font-weight:600}
input.invalid,select.invalid,textarea.invalid{border-color:var(--red);background:var(--red-l)}

table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:.71rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;background:var(--slate-l);position:sticky;top:0}
tbody tr:hover{background:var(--line-2)}
.table-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:var(--r-sm)}

.notice{border-radius:var(--r-sm);padding:11px 14px;font-size:.82rem;border:1px solid;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.notice svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.notice.info{background:var(--blue-l);border-color:#c7ddf6;color:#123a6b}
.notice.warn{background:var(--amber-l);border-color:#f3ddb4;color:#7a4406}
.notice.danger{background:var(--red-l);border-color:#f6cfcf;color:#8a1c1c}
.notice.ok{background:var(--green-l);border-color:#c5e8d2;color:#125c2f}
body.dark .notice.info{color:#bcd8f7}
body.dark .notice.warn{color:#f3d49a}
body.dark .notice.danger{color:#f4b5b5}
body.dark .notice.ok{color:#a8e6c0}

.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty svg{width:42px;height:42px;stroke:var(--line);fill:none;stroke-width:1.6;margin-bottom:10px}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:.8rem}
.bar-track{background:var(--slate-l);border-radius:20px;height:9px;overflow:hidden}
.bar-fill{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#38bdf8);border-radius:20px;transition:width .5s}
.bar-val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

.pipeline{display:flex;gap:4px;flex-wrap:wrap}
.step{font-size:.64rem;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--slate-l);color:var(--muted);letter-spacing:.02em}
.step.done{background:var(--green-l);color:var(--green)}
.step.current{background:var(--teal);color:#fff}
.step.bad{background:var(--red-l);color:var(--red)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{background:none;border:none;padding:9px 14px;font-family:inherit;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--teal-d);border-bottom-color:var(--teal)}

.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;background:var(--line-2);transition:.18s;cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--teal);background:var(--teal-l)}
.dropzone svg{width:38px;height:38px;stroke:var(--teal);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dropzone strong{display:block;margin:8px 0 3px}
.dropzone span{font-size:.78rem;color:var(--muted)}

.progress{height:7px;background:var(--slate-l);border-radius:20px;overflow:hidden;margin-top:9px}
.progress > i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s;border-radius:20px}

.med-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);display:flex;flex-direction:column;gap:7px;transition:.18s}
.med-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:#cfe3f3}
.med-card .m-name{font-weight:700;font-size:.9rem;line-height:1.3}
.med-card .m-gen{font-size:.75rem;color:var(--muted)}
.med-card .m-price{font-weight:800;font-size:1.02rem;color:var(--navy)}
body.dark .med-card .m-price{color:#7dd3fc}
.chips{display:flex;gap:5px;flex-wrap:wrap}

.skel{background:linear-gradient(90deg,var(--slate-l) 25%,var(--line-2) 37%,var(--slate-l) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:8px;height:14px;margin-bottom:8px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

.modal-root{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding:22px;overflow-y:auto;background:rgba(11,37,69,.55)}
.modal-root.show{display:flex}
.modal{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-lg);width:100%;max-width:720px;margin:auto;border:1px solid var(--line);animation:pop .18s ease}
.modal.wide{max-width:980px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:1.05rem}
.modal-body{padding:18px;max-height:66vh;overflow:auto}
.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.x-btn{background:none;border:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
.x-btn:hover{background:var(--slate-l)}

.toast-root{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:min(360px,92vw)}
.toast{background:var(--navy);color:#fff;padding:11px 15px;border-radius:var(--r-sm);box-shadow:var(--shadow-lg);font-size:.83rem;display:flex;gap:9px;align-items:flex-start;animation:slidein .22s ease}
.toast.ok{background:#0f5132}.toast.err{background:#7f1d1d}.toast.warn{background:#78350f}.toast.info{background:var(--navy)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

.dl{display:grid;grid-template-columns:190px 1fr;gap:6px 14px;font-size:.83rem}
.dl dt{color:var(--muted);font-weight:700}
.dl dd{margin:0;word-break:break-word}
@media(max-width:560px){.dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:8px}}

.hero{background:linear-gradient(135deg,#0b2545 0%,#124a63 55%,#0d9488 130%);color:#fff;border-radius:var(--r);padding:34px 28px;position:relative;overflow:hidden;margin-bottom:18px}
.hero h1{color:#fff;font-size:1.85rem;max-width:760px}
.hero p{color:#c9e3ef;max-width:660px;font-size:.92rem}
.hero .row{margin-top:16px}
.hero .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.24)}
.hero .btn.primary{background:var(--teal);border-color:var(--teal)}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 68%)}

.feat{display:flex;gap:11px;align-items:flex-start}
.feat .fi{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--teal-l);display:grid;place-items:center}
.feat .fi svg{width:17px;height:17px;stroke:var(--teal-d);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feat strong{font-size:.87rem}
.feat p{font-size:.79rem;color:var(--muted);margin:2px 0 0}

.chat-wrap{display:grid;grid-template-columns:270px 1fr;gap:14px;min-height:520px}
@media(max-width:760px){.chat-wrap{grid-template-columns:1fr}}
.conv-list{border:1px solid var(--line);border-radius:var(--r-sm);overflow:auto;max-height:520px;background:var(--card)}
.conv{padding:11px 13px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.15s}
.conv:hover{background:var(--line-2)}
.conv.active{background:var(--teal-l);border-left:3px solid var(--teal)}
.conv strong{font-size:.83rem;display:block}
.conv span{font-size:.73rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-pane{border:1px solid var(--line);border-radius:var(--r-sm);display:flex;flex-direction:column;background:var(--card);overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:11px;max-height:400px;background:var(--line-2)}
.msg{max-width:78%;padding:9px 13px;border-radius:13px;font-size:.845rem;line-height:1.45}
.msg .meta{display:block;font-size:.66rem;opacity:.7;margin-top:4px}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-input{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line);background:var(--card)}

.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:14px}
.tl-item::before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--card);border:2px solid var(--teal)}
.tl-item.bad::before{border-color:var(--red)}
.tl-item.pending::before{border-color:var(--line)}
.tl-item strong{font-size:.84rem;display:block}
.tl-item span{font-size:.73rem;color:var(--muted)}

.faq{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;overflow:hidden}
.faq summary{padding:11px 14px;cursor:pointer;font-weight:600;font-size:.86rem;background:var(--card);list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"＋ ";color:var(--teal);font-weight:800}
.faq[open] summary::before{content:"− "}
.faq .faq-body{padding:0 14px 13px;font-size:.83rem;color:var(--navy-2)}
body.dark .faq .faq-body{color:#c2d6ea}

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.76rem;word-break:break-all}
.small{font-size:.78rem}
.muted{color:var(--muted)}
.center{text-align:center}
.nowrap{white-space:nowrap}
.mt0{margin-top:0}.mb0{margin-bottom:0}.mt8{margin-top:8px}.mt14{margin-top:14px}.mb14{margin-bottom:14px}

@media print{
  .sidebar,.topbar,.backdrop,.toast-root,.no-print,.modal-foot{display:none !important}
  body{background:#fff}
  .view{padding:0;max-width:none}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .table-wrap{max-height:none;overflow:visible;border-color:#ccc}
  th{background:#f2f2f2 !important}
}
</style>
</head>
<body>

<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="MedSwift logo">
        <defs>
          <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#15395e"/>
          </linearGradient>
        </defs>

/* ---- SHA-256 (Web Crypto) with honest, clearly-labelled fallback ---- */
async function sha256Hex(input){
  try {
    if (!window.crypto || !window.crypto.subtle) throw new Error('subtle-unavailable');
    const bytesIn = (typeof input === 'string') ? new TextEncoder().encode(input) : input;
    const buf = await crypto.subtle.digest('SHA-256', bytesIn);
    return Array.prototype.map.call(new Uint8Array(buf), b => b.toString(16).padStart(2,'0')).join('');
  } catch (e) {
    return 'NONCRYPTO-FALLBACK-' + fnv1a64(typeof input === 'string' ? input : 'binary-file');
  }
}
/** Non-cryptographic fallback hash — clearly labelled, NOT a security hash. */
function fnv1a64(str){
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 ^= c; h1 = (h1 * 0x01000193) >>> 0;
    h2 = (h2 + c * (i + 7)) >>> 0;
  }
  return (h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0')).toUpperCase();
}

function download(filename, text, mime){
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function checkMedicinePolicy(med, opts){
  opts = opts || {};
  if (!med) return { allowed:false, code:'UNKNOWN_MEDICINE', reason:'Medicine record could not be resolved.' };
  if (med.schedule === 'X')        return { allowed:false, code:'BLOCK_SCHEDULE_X', reason:'Blocked by policy POL-001. Schedule X items are not offered for checkout or delivery in this project.' };
  if (med.schedule === 'NDPS')     return { allowed:false, code:'BLOCK_NDPS',       reason:'Blocked by policy POL-002. Restricted / narcotic category is not offered in this project.' };
  if (med.schedule === 'UNVERIFIED' || !med.classificationVerified && med.schedule === 'UNVERIFIED')
                                   return { allowed:false, code:'BLOCK_UNVERIFIED', reason:'Blocked by policy POL-005. Classification is unverified and requires review.' };
  if (med.stock === 'Out of Stock')return { allowed:false, code:'OUT_OF_STOCK',     reason:'Not available in the workspace inventory.' };
  if (med.rx && !opts.hasApprovedRx)
                                   return { allowed:false, code:'RX_REQUIRED',      reason:'Prescription required \u2014 no pharmacist-approved prescription is linked to this item.' };
  return { allowed:true, code:'OK', reason: med.rx ? 'Prescription-required item with an approved prescription linked (localOnly).' : 'General sale item under the local policy table.' };
}

/* ==========================================================================
   9. TAMPER-EVIDENT AUDIT CHAIN
   Each event references the previous event's hash. This is a LOCAL hash chain,
   NOT a deployed blockchain. A permissioned-ledger adapter could be added later.
   ========================================================================== */
const Audit = {
  async append(ev){
    const prev = State.audit.length ? State.audit[State.audit.length - 1].hash : 'GENESIS';
    const base = {
      id: 'EVT-' + String(State.audit.length + 1).padStart(5,'0'),
      ts: nowISO(),
      actor: ev.actor || (State.user ? State.user.name : 'System'),
      role: ev.role || State.role || 'system',
      action: ev.action,
      target: ev.target || '\u2014',
      result: ev.result || 'OK',
      reason: ev.reason || '',
      prevHash: prev
    };
    base.hash = await sha256Hex(JSON.stringify(base));
    State.audit.push(base);
    return base;
  },
  async verifyChain(){
    let prev = 'GENESIS';
    for (let i = 0; i < State.audit.length; i++){
      const e = State.audit[i];
      const clone = Object.assign({}, e);
      const stored = clone.hash;
      delete clone.hash;
      if (clone.prevHash !== prev) return { ok:false, index:i, id:e.id, reason:'Previous-hash link mismatch.' };
      const recomputed = await sha256Hex(JSON.stringify(clone));
      if (recomputed !== stored) return { ok:false, index:i, id:e.id, reason:'Event hash does not match recomputed hash.' };
      prev = stored;
    }
    return { ok:true, count: State.audit.length };
  }
};

function rxPipeline(current){
  const steps = ['UPLOADED','OCR_PENDING','DOCTOR_CHECK_PENDING','PHARMACIST_REVIEW_PENDING','APPROVED'];
  const order = steps.concat(['REJECTED','ESCALATED']);
  if (current === 'DISPENSING_RECORDED') current = 'APPROVED';
  const idx = steps.indexOf(current);
  return '<div class="pipeline">' + steps.map(function(s, i){
    let cls = 'step';
    if (current === 'REJECTED' || current === 'ESCALATED') cls += (s === 'APPROVED' ? ' bad' : '');
    else if (i < idx) cls += ' done';
    else if (i === idx) cls += ' current';
    return '<span class="' + cls + '">' + esc(s.replace(/_/g,' ')) + '</span>';
  }).join('') + '</div>';
}

function filteredMedicines(){
  const f = State.filters.catalogue || { q:'', cat:'', sort:'name', rxOnly:'' };
  const term = (f.q || '').trim().toLowerCase();
  let list = MEDICINES.filter(function(m){
    if (f.cat && m.category !== f.cat) return false;
    if (f.rxOnly === 'rx' && !m.rx) return false;
    if (f.rxOnly === 'otc' && m.rx) return false;
    if (!term) return true;
    return (m.name + ' ' + m.generic + ' ' + m.brand + ' ' + m.category).toLowerCase().indexOf(term) !== -1;
  });
  if (f.sort === 'priceAsc') list.sort((a,b) => a.price - b.price);
  else if (f.sort === 'priceDesc') list.sort((a,b) => b.price - a.price);
  else list.sort((a,b) => a.name.localeCompare(b.name));
  return list;
}

const ALLOWED_RX = { 'application/pdf':1, 'image/jpeg':1, 'image/png':1 };
const MAX_RX = 5 * 1024 * 1024;

async function handleRxFile(file){
  const host = $('#upStatus');
  const extOk = /\.(pdf|jpe?g|png)$/i.test(file.name);
  if (!ALLOWED_RX[file.type] && !extOk){
    host.innerHTML = notice('danger','Unsupported file type. Please upload a PDF, JPG, JPEG or PNG file.');
    toast('Unsupported file type','err'); return;
  }
  if (file.size > MAX_RX){
    host.innerHTML = notice('danger','File is too large (' + bytes(file.size) + '). Maximum allowed is 5 MB.');
    toast('File too large','err'); return;
  }

  host.innerHTML =
    '<div class="card tight"><strong>' + esc(file.name) + '</strong>' +
    '<div class="small muted">' + esc(file.type || 'unknown type') + ' \u00B7 ' + bytes(file.size) + '</div>' +
    '<div class="progress"><i id="upBar" style="width:8%"></i></div>' +
    '<div class="small muted mt8" id="upMsg">Reading file and computing integrity hash\u2026</div>' +
    '<div id="upPreview" class="mt14"></div></div>';

  const bar = $('#upBar');
  let pct = 8;
  const tick = setInterval(() => { pct = Math.min(88, pct + 12); if (bar) bar.style.width = pct + '%'; }, 180);

  let buffer = null;
  try { buffer = await file.arrayBuffer(); } catch(e){ buffer = null; }
  const hash = await sha256Hex(buffer || (file.name + '|' + file.size));

  clearInterval(tick);
  if (bar) bar.style.width = '100%';

  const dup = await API.checkDuplicatePrescription(hash);

  let preview = '';
  if (/^image\//.test(file.type)){
    const url = URL.createObjectURL(file);
    preview = '<div><div class="small muted mb0">Local preview (not uploaded)</div>' +
              '<img src="' + url + '" alt="Preview of the selected prescription image" ' +
              'style="max-width:100%;max-height:320px;border:1px solid var(--line);border-radius:10px;margin-top:6px">' +
              '<div class="row mt8"><button class="btn sm danger" data-act="remove-upload">' + esc(t('common.remove')) + '</button>' +
              '<button class="btn sm" data-act="replace-upload">Replace file</button></div></div>';
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } else {
    preview = '<div class="small muted">PDF preview is not rendered in this workspace. ' +
              'The file was read locally only to compute its integrity hash.</div>' +
              '<div class="row mt8"><button class="btn sm danger" data-act="remove-upload">' + esc(t('common.remove')) + '</button>' +
              '<button class="btn sm" data-act="replace-upload">Replace file</button></div>';
  }
  const prev = $('#upPreview');
  if (prev) prev.innerHTML = preview;

  const msg = $('#upMsg');
  if (msg) msg.textContent = 'File read locally. No upload occurred.';

  // OCR stage (not connected)
  const ocr = await API.extractPrescriptionData(file);

  const record = {
    id: 'RX-' + new Date().getFullYear() + '-' + String(State.prescriptions.length + 1).padStart(4,'0'),
    patient: State.user ? State.user.name + ' (WORKSPACE)' : 'Guest (WORKSPACE)',
    patientRef: 'PT-WORKSPACE-001',
    doctorName: ocr.fields.doctorName.value,
    registrationNumber: ocr.fields.registrationNumber.value,
    council: 'Local State Medical Council',
    issueDate: ocr.fields.prescriptionDate.value,
    status: 'PHARMACIST_REVIEW_PENDING',
    fileName: file.name, fileSize: file.size, fileType: file.type || 'unknown',
    hash: hash, hashEngine: hashEngineLabel(hash),
    items: [],
    doctorCheck: { status:'Pending manual verification', source:'Not connected', at: nowISO() },
    review: null, dispensed: false,
    duplicateOf: dup.duplicate ? dup.originalId : null,
    note: 'Workspace record \u2014 OCR not connected; fields are illustrative placeholders.'
  };
  State.prescriptions.push(record);

  await Audit.append({
    action:'PRESCRIPTION_UPLOAD', target: record.id, result:'OK',
    reason:'File read locally; SHA-256 computed; no upload performed. Hash engine: ' + record.hashEngine
  });
  await Audit.append({
    action:'OCR_EXTRACTION_RESULT', target: record.id, result:'NOT_CONNECTED',
    reason:'No OCR service connected. Placeholder fields returned and marked Needs Review.'
  });
  if (dup.duplicate){
    await Audit.append({
      action:'DUPLICATE_DETECTION', target: record.id, result:'ALERT',
      reason:'Identical file hash already present on record ' + dup.originalId
    });
  }

  let banner = '';
  banner += notice('ok','<strong>Integrity hash computed.</strong> Engine: ' + esc(record.hashEngine) +
    '<div class="mono mt8">' + esc(hash) + '</div>' +
    '<div class="small muted mt8">Hashing detects exact-file reuse only. It does not detect visually altered copies, re-photographed documents or all prescription fraud. ' +
    'Real anti-reuse enforcement requires a trusted shared backend with atomic transaction controls across participating pharmacies.</div>');
  if (dup.duplicate){
    banner += notice('danger','<strong>Duplicate document hash detected.</strong> This exact file matches workspace record <strong>' + esc(dup.originalId) + '</strong>. ' +
      'A second localOnly dispensing event against the same consumed prescription will be blocked. Legitimate repeat scenarios must be reviewed by a pharmacist rather than automatically treated as fraud.');
  }
  banner += notice('warn','<strong>' + esc(ocr.banner) + '</strong><div class="mt8">OCR output is untrusted until a registered pharmacist compares it against the original document.</div>');

  host.innerHTML = banner +
    '<div class="card tight"><dl class="dl">' +
      '<dt>Prescription ID</dt><dd>' + esc(record.id) + '</dd>' +
      '<dt>File</dt><dd>' + esc(file.name) + ' \u00B7 ' + bytes(file.size) + '</dd>' +
      '<dt>SHA-256 hash</dt><dd class="mono">' + esc(hash) + '</dd>' +
      '<dt>Workflow status</dt><dd>' + statusBadge(record.status) + '</dd>' +
    '</dl>' +
    '<div class="row mt14"><button class="btn primary" data-act="go" data-id="rxstatus">Open verification view</button>' +
    '<button class="btn" data-act="go" data-id="desk">Go to pharmacist desk</button>' +
    '<button class="btn" data-act="remove-upload">Remove from view</button></div></div>';

  toast('Prescription recorded locally (workspace)','ok');
  renderNav();
}

function reviewDialog(rxId, decision){
  openModal(decision + ' \u2014 ' + rxId,
    notice('danger','<strong>LOCAL-ONLY DECISION.</strong> This will be recorded as <em>LOCAL-ONLY \u2014 NOT A REAL DISPENSING APPROVAL</em>. ' +
      'No real registered pharmacist is involved and no medicine is dispensed.') +
    '<div class="field"><label for="rvReason">Reason (required)</label>' +
      '<textarea id="rvReason" placeholder="Describe the basis for this decision\u2026"></textarea>' +
      '<div class="err" id="rvErr" style="display:none">A reason is required.</div></div>' +
    '<div class="field"><label for="rvNote">Private audit note (optional)</label>' +
      '<textarea id="rvNote" placeholder="Visible only in the workspace audit trail\u2026"></textarea></div>',
    '<button class="btn" data-act="close-modal">' + esc(t('common.cancel')) + '</button>' +
    '<button class="btn primary" id="rvConfirm">Record localOnly decision</button>');

  $('#rvConfirm').addEventListener('click', async function(){
    const reason = $('#rvReason').value.trim();
    if (!reason){
      $('#rvErr').style.display = 'block';
      $('#rvReason').classList.add('invalid');
      return;
    }
    const p = State.prescriptions.find(x => x.id === rxId);
    if (!p) return;

    await API.reviewPrescription(p);

    if (decision === 'APPROVED'){
      if (p.dispensed && p.duplicateOf){
        closeModal();
        toast('Blocked: this prescription has already been consumed (workspace rule).','err');
        await Audit.append({ action:'DISPENSING_BLOCKED', target: p.id, result:'BLOCKED',
          reason:'Prescription already consumed and file hash matches an existing record.' });
        render(); return;
      }
      p.status = 'APPROVED';
      p.review = { decision:'APPROVED', by:(State.user ? State.user.name : 'Workspace Pharmacist') + ' (LOCAL-ONLY)',
                   at: nowISO(), reason: reason, note: $('#rvNote').value.trim(), localOnly:true };
    } else if (decision === 'REJECTED'){
      p.status = 'REJECTED';
      p.review = { decision:'REJECTED', by:(State.user ? State.user.name : 'Workspace Pharmacist') + ' (LOCAL-ONLY)',
                   at: nowISO(), reason: reason, note: $('#rvNote').value.trim(), localOnly:true };
    } else {
      p.status = 'ESCALATED';
      p.review = { decision:'ESCALATED', by:(State.user ? State.user.name : 'Workspace Pharmacist') + ' (LOCAL-ONLY)',
                   at: nowISO(), reason: reason, note: $('#rvNote').value.trim(), localOnly:true };
    }

    await Audit.append({ action:'PHARMACIST_REVIEW_' + decision, target:p.id, result: decision,
      reason: reason + ' [LOCAL-ONLY \u2014 NOT A REAL DISPENSING APPROVAL]' });

    if (decision === 'APPROVED') await recordDispensing(p.id);

    closeModal();
    toast('Local-Only review recorded: ' + decision, decision === 'REJECTED' ? 'warn' : 'ok');
    render();
  });
}
/** Local-Only dispensing + auto H1 register entry creation. */
async function recordDispensing(rxId){
  const p = State.prescriptions.find(x => x.id === rxId);
  if (!p || p.dispensed) return;
  p.dispensed = true;
  p.status = 'DISPENSING_RECORDED';

  const txn = uid('DISP');
  await API.recordDispensing({ rxId: rxId, txn: txn });

  // H1 register auto-logging for eligible H1-classified items.
  (p.items || []).forEach(function(it){
    const m = findMed(it.medId);
    if (!m || m.schedule !== 'H1') return;
    const exists = State.h1.some(h => h.txn === txn && h.medicine === m.name);
    if (exists) return;
    const entry = {
      id: 'H1-' + String(State.h1.length + 1).padStart(4,'0'),
      patientRef: p.patientRef, patientName: p.patient,
      doctor: p.doctorName, regNo: p.registrationNumber || 'Not provided',
      medicine: m.name + ' ' + m.strength,
      qty: it.qty,
      date: new Date().toISOString().slice(0,10),
      rxRef: p.id, partner:'PH-001',
      pharmacist: (State.user ? State.user.name : 'Workspace Pharmacist') + ' (LOCAL-ONLY)',
      txn: txn, createdAt: nowISO(), corrections: []
    };
    State.h1.push(entry);
    Audit.append({ action:'H1_REGISTER_ENTRY_CREATED', target: entry.id, result:'OK',
      reason:'Auto-created from localOnly dispensing transaction ' + txn + ' (H1 local classification).' });
  });

  await Audit.append({ action:'DISPENSING_RECORDED', target: p.id, result:'LOCAL-ONLY',
    reason:'Local-Only dispensing transaction ' + txn + '. No real medicine was dispensed.' });
  toast('Local-Only dispensing recorded (no real medicine dispensed)','warn');
}

      input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); sendChat(); } });
      input.focus();
    }
  }
};
function sendChat(){
  const input = $('#chatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const c = State.chats[State.activeConv];
  if (!c) return;
  c.messages.push({ from:'me', text: text, at: nowISO() });
  input.value = '';
  render();
  setTimeout(function(){
    const c2 = State.chats[State.activeConv];
    c2.messages.push({
      from:'them',
      text:'[AUTOMATED WORKSPACE RESPONSE] No real pharmacist is connected. Your message was not sent anywhere and no clinical advice can be given in this working. Please contact a registered pharmacist or your prescriber for real guidance.',
      at: nowISO()
    });
    if (State.route === 'chat') render();
  }, 900);
  Audit.append({ action:'CHAT_MESSAGE_SENT', target:c.id, result:'LOCAL-ONLY', reason:'Local workspace chat \u2014 no backend messaging service connected.' });
}

    if (idx < 0 || idx >= ORDER_FLOW.length - 1) return;
    const next = ORDER_FLOW[idx + 1];
    o.status = next;
    o.timeline.push({ s:next, at: nowISO() });

    await Audit.append({ action:'ORDER_STATUS_CHANGED', target:o.id, result:next,
      reason:'Local-Only order progression to ' + next + '. No real logistics provider involved.' });
    if (next === 'PACKED') await Audit.append({ action:'PACKAGING_SEAL_RECORDED', target:o.id, result:'OK', reason:'Seal ' + o.sealId + ' recorded at packing (localOnly).' });

  'h1-export': function(){
    const rows = [['Entry ID','Date','Patient ref','Patient name','Prescriber','Reg no','Medicine','Qty','Rx ref','Partner','Pharmacist','Txn ref','Audit timestamp']];
    State.h1.forEach(h => rows.push([h.id,h.date,h.patientRef,h.patientName,h.doctor,h.regNo,h.medicine,h.qty,h.rxRef,h.partner,h.pharmacist,h.txn,h.createdAt]));
    download('medswift-h1-register-local.csv', toCSV(rows), 'text/csv;charset=utf-8');
    Audit.append({ action:'DATA_EXPORT', target:'h1-register', result:'OK', reason:'H1 register exported as CSV (localOnly register).' });
    toast('CSV downloaded (localOnly register)','ok');
  },
  'h1-print': function(){ window.print(); },
  'h1-correct': async function(el){
    const h = State.h1.find(x => x.id === el.dataset.id);
    if (!h) return;
    openModal('Amend H1 entry (audit-safe)',
      notice('warn','Corrections are recorded as <strong>new audit events</strong>. History is never silently overwritten.') +
      '<div class="field"><label for="h1Field">Field to correct</label><select id="h1Field">' +
        '<option value="doctor">Prescriber</option><option value="regNo">Registration number</option>' +
        '<option value="pharmacist">Pharmacist reference</option><option value="medicine">Medicine</option>' +
      '</select></div>' +
      '<div class="field"><label for="h1Val">Corrected value</label><input type="text" id="h1Val"></div>' +
      '<div class="field"><label for="h1Why">Reason (required)</label><input type="text" id="h1Why"></div>',
      '<button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" id="h1Go">Record correction</button>');
    $('#h1Go').addEventListener('click', async function(){
      const field = $('#h1Field').value, val = ($('#h1Val').value || '').trim(), why = ($('#h1Why').value || '').trim();
      if (!val || !why){ toast('Corrected value and reason are required','err'); return; }
      const before = h[field];
      h[field] = val;
      h.corrections.push({ at: nowISO(), field: field, from: before, to: val, reason: why,
        by: State.user ? State.user.name : 'unknown' });
      await Audit.append({ action:'H1_REGISTER_CORRECTION', target:h.id, result:'CORRECTED',
        reason:'Field "' + field + '" amended. Reason: ' + why + '. Previous value retained in correction history.' });
      closeModal(); toast('Correction recorded (localOnly register)','ok'); render();
    });
  },

  /* --- audit --- */
  'audit-verify': async function(){
    const host = $('#auditVerify');
    host.innerHTML = '<div class="skel" style="width:40%"></div>';
    const res = await Audit.verifyChain();
    if (res.ok){
      host.innerHTML = notice('ok','<strong>Chain integrity verified.</strong> All ' + res.count + ' event(s) match their recorded hashes and previous-hash links.');
    } else {
      host.innerHTML = notice('danger','<strong>Integrity check failed</strong> at event ' + esc(res.id) + ' (index ' + res.index + '): ' + esc(res.reason));
    }
    toast(res.ok ? 'Audit chain verified' : 'Audit chain integrity failure', res.ok ? 'ok' : 'err');
  },
  'audit-export': function(){
    const rows = [['Event ID','Timestamp','Actor','Role','Action','Target','Result','Reason','Previous hash','Hash']];
    State.audit.forEach(e => rows.push([e.id,e.ts,e.actor,e.role,e.action,e.target,e.result,e.reason,e.prevHash,e.hash]));
    download('medswift-audit-trail.csv', toCSV(rows), 'text/csv;charset=utf-8');
    toast('Audit trail exported','ok');
  },
  'audit-print': function(){ window.print(); },

  /* --- analytics / report printing --- */
  'analytics-print': function(){ window.print(); },
  'print-report': function(){ window.print(); },
  'clear-report': function(){ const h = $('#reportOut'); if (h) h.innerHTML = ''; toast('Cleared','info'); },

  /* --- settings / misc --- */
  'reset-workspace': function(){
    confirmDialog('Reset workspace environment','This clears all in-memory workspace data (medicine list, prescriptions, orders, reminders, H1 entries and the audit chain) and re-seeds the local environment. Continue?','Reset', function(){
      seedAll();
      Audit.append({ action:'WORKSPACE_ENVIRONMENT_RESET', target:'system', result:'OK', reason:'User reset the workspace environment.' });
      toast('Workspace environment reset','ok');
      go('home');
    });
  },
  'clear-prefs': function(){
    try { localStorage.removeItem('medswift.lang'); localStorage.removeItem('medswift.theme'); } catch(e){}
    toast('Stored preferences cleared','info');
  },
  'notif-request': function(){
    if (!('Notification' in window)){ toast('Notifications are not supported in this browser','err'); return; }
    Notification.requestPermission().then(function(p){
      State.notifications = (p === 'granted');
      toast('Notification permission: ' + p + (p === 'granted' ? ' (this workspace will not send any)' : ''), p === 'granted' ? 'ok' : 'warn');
    });
  },
  'support-send': async function(){
    const msg = ($('#hpMsg').value || '').trim();
    if (!msg){ toast('Please enter a message','err'); return; }
    await Audit.append({ action:'SUPPORT_MESSAGE_WORKSPACE', target:'help', result:'NOT_SENT', reason:'Workspace form \u2014 nothing transmitted.' });
    $('#hpMsg').value = '';
    toast('Nothing was transmitted \u2014 this is a workspace form.','info');
  },

};

/* ==========================================================================
   16. LOGIN MODAL
   ========================================================================== */
function openLogin(presetRole){
  const accounts = WORKSPACE_USERS.map(function(u){
    return '<tr><td class="small"><strong>' + esc(u.email) + '</strong><div class="muted">' + esc(ROLES[u.role].label) + '</div></td>' +
           '<td class="small mono">workspace1234</td>' +
           '<td><button class="btn xs" data-act="fill-login" data-email="' + esc(u.email) + '">Use</button></td></tr>';
  }).join('');

  openModal('Workspace sign in',
    notice('warn','<strong>Workspace authentication is not production security.</strong> ' +
      'Credentials are hard-coded in this file for working. In production, authenticate and authorise on the server \u2014 never by hiding front-end elements.') +
    '<div class="tabs" role="tablist">' +
      '<button class="tab active" data-act="auth-tab" data-tab="login" role="tab">Sign in</button>' +
      '<button class="tab" data-act="auth-tab" data-tab="signup" role="tab">Create workspace account</button>' +
    '</div>' +
    '<div id="authPane">' +
      '<div class="field"><label for="liEmail">Email</label><input type="email" id="liEmail" autocomplete="username" placeholder="patient@workspace.medswift"></div>' +
      '<div class="field"><label for="liPass">Password</label>' +
        '<div class="row" style="gap:6px;flex-wrap:nowrap">' +
          '<input type="password" id="liPass" autocomplete="current-password" placeholder="workspace1234">' +
          '<button class="btn sm" data-act="toggle-pass" data-target="liPass" type="button">Show</button>' +
        '</div></div>' +
      '<div class="err" id="liErr" style="display:none"></div>' +
      '<button class="btn primary" data-act="do-login" style="width:100%">Sign in</button>' +
    '</div>' +
    '<div class="mt14"><strong class="small">Workspace accounts</strong>' +
      '<div class="table-wrap mt8"><table><thead><tr><th>Account</th><th>Password</th><th></th></tr></thead><tbody>' + accounts + '</tbody></table></div>' +
    '</div>' +
    '<p class="small muted mt14">Session handling is in-memory only. Reloading the page signs you out. ' +
    'Role permissions shown in the interface implement least privilege for the workspace; the server must enforce them in production.</p>',
    '<button class="btn" data-act="close-modal">' + esc(t('common.close')) + '</button>');

  if (presetRole){
    const u = WORKSPACE_USERS.find(x => x.role === presetRole);
    if (u){ $('#liEmail').value = u.email; $('#liPass').value = u.password; }
  }
}
async function doLogin(email, password){
  const err = $('#liErr');
  const u = WORKSPACE_USERS.find(x => x.email.toLowerCase() === String(email).toLowerCase().trim());
  if (!u || u.password !== password){
    if (err){ err.textContent = 'Invalid workspace credentials. Use one of the workspace accounts listed below.'; err.style.display = 'block'; }
    toast('Invalid workspace credentials','err');
    await Audit.append({ action:'LOGIN_FAILED', target:String(email).slice(0, 40), result:'FAILED', reason:'Workspace credential mismatch.' });
    renderNav();
    return;
  }
  await API.authenticateUser({ email: email });
  State.user = { name: u.name, email: u.email };
  State.role = u.role;
  await Audit.append({ action:'LOGIN', target:u.email, result:'OK', reason:'Workspace session opened for role ' + u.role + ' (localOnly authentication).' });
  closeModal();
  toast('Signed in as ' + u.name + ' (workspace)','ok');
  go('dashboard');
}
function doLogout(){
  const email = State.user ? State.user.email : 'unknown';
  State.user = null; State.role = null;
  Audit.append({ action:'LOGOUT', target:email, result:'OK', reason:'Workspace session closed.' });
  toast('Signed out','info');
  go('home');
}

/* ==========================================================================
   17. GLOBAL EVENT DELEGATION + SHELL WIRING
   ========================================================================== */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;

  // Modal backdrop click-to-close
  if (e.target.id === 'modalRoot'){ closeModal(); return; }

  const act = el.dataset.act;

  /* Inline actions that need element context */
  if (act === 'fill-login'){
    $('#liEmail').value = el.dataset.email;
    const u = WORKSPACE_USERS.find(x => x.email === el.dataset.email);
    if (u) $('#liPass').value = u.password;
    return;
  }
  if (act === 'toggle-pass'){
    const inp = document.getElementById(el.dataset.target);
    if (inp){ inp.type = inp.type === 'password' ? 'text' : 'password'; el.textContent = inp.type === 'password' ? 'Show' : 'Hide'; }
    return;
  }
  if (act === 'auth-tab'){
    $$('.tab[data-act="auth-tab"]').forEach(b => b.classList.toggle('active', b === el));
    const pane = $('#authPane');
    if (el.dataset.tab === 'signup'){
      pane.innerHTML =
        '<div class="field"><label for="suName">Full name</label><input type="text" id="suName" placeholder="Workspace name"></div>' +
        '<div class="field"><label for="suEmail">Email</label><input type="email" id="suEmail" placeholder="you@illustrative.invalid"></div>' +
        '<div class="field"><label for="suRole">Workspace role</label><select id="suRole">' +
          Object.keys(ROLES).map(r => '<option value="' + r + '">' + esc(ROLES[r].label) + '</option>').join('') +
        '</select></div>' +
        '<div class="field"><label for="suPass">Password</label><input type="password" id="suPass" placeholder="At least 8 characters"></div>' +
        '<div class="err" id="liErr" style="display:none"></div>' +
        '<button class="btn primary" data-act="do-signup" style="width:100%">Create workspace account</button>' +
        notice('info','Workspace signup does not create a real account. It opens a localOnly session for the selected role.');
    } else {
      openLogin();
    }
    return;
  }
  if (act === 'do-login'){
    doLogin($('#liEmail').value, $('#liPass').value);
    return;
  }
  if (act === 'do-signup'){
    const name = ($('#suName').value || '').trim();
    const email = ($('#suEmail').value || '').trim();
    const pass = $('#suPass').value || '';
    const role = $('#suRole').value;
    const err = $('#liErr');
    const problems = [];
    if (!name) problems.push('Name is required.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) problems.push('A valid email is required.');
    if (pass.length < 8) problems.push('Password must be at least 8 characters.');
    if (problems.length){
      err.textContent = problems.join(' ');
      err.style.display = 'block';
      return;
    }
    State.user = { name: name, email: email };
    State.role = role;
    Audit.append({ action:'SIGNUP_WORKSPACE', target:email, result:'OK', reason:'Local-Only account created for role ' + role + '. No real account exists.' });
    closeModal();
    toast('Workspace session started for ' + ROLES[role].label,'ok');
    go('dashboard');
    return;
  }

  const fn = ACTIONS[act];
  if (typeof fn === 'function'){ e.preventDefault(); fn(el, e); }
});

/* Keyboard support for role="button" elements */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.dataset && e.target.dataset.act){
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
    e.preventDefault();
    e.target.click();
  }
});

/* Language quick-switch */
$('#langQuick').addEventListener('change', function(){
  State.lang = this.value;
  try { localStorage.setItem('medswift.lang', State.lang); } catch(e){}
  Audit.append({ action:'LANGUAGE_CHANGED', target:'ui', result:'OK', reason:'Interface language set to ' + State.lang + '.' });
  render();
  toast('Language updated','ok');
});

/* Hamburger / backdrop */
$('#hamburger').addEventListener('click', function(){
  const open = $('#sidebar').classList.toggle('open');
  $('#backdrop').classList.toggle('show', open);
  this.setAttribute('aria-expanded', String(open));
});
$('#backdrop').addEventListener('click', function(){
  $('#sidebar').classList.remove('open');
  this.classList.remove('show');
  $('#hamburger').setAttribute('aria-expanded','false');
});

/* Persisted non-sensitive preferences */
try {
  const savedLang = localStorage.getItem('medswift.lang');
  const savedTheme = localStorage.getItem('medswift.theme');
  if (savedLang && I18N[savedLang]) State.lang = savedLang;
  if (savedTheme === 'dark'){ State.theme = 'dark'; document.body.classList.add('dark'); }
} catch(e){ /* localStorage unavailable — safe to ignore */ }

/* Theme changes come from the Settings view */
document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'stTheme'){
    State.theme = e.target.value;
    document.body.classList.toggle('dark', State.theme === 'dark');
    try { localStorage.setItem('medswift.theme', State.theme); } catch(err){}
    toast('Theme updated','ok');
  }
  if (e.target && e.target.id === 'stLang'){
    State.lang = e.target.value;
    try { localStorage.setItem('medswift.lang', State.lang); } catch(err){}
    render();
    toast('Language updated','ok');
  }
});

   18. BOOTSTRAP
   ========================================================================== */
(function init(){
  seedAll();
  render();
  // Non-blocking informational toast on first load.
  setTimeout(function(){
    toast('MedSwift workspace loaded \u2014 all data is illustrative local data.','info');
  }, 700);
})();
</script>
